<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    SunCity · Íconos. Un solo juego, rejilla de 24, trazo de 2 px, extremos redondos.
    Uso:  <svg class="sc-icono" aria-hidden="true"><use href="../compartido/iconos.svg#descargar"/></svg>
    El color y el trazo los pone .sc-icono (componentes.css) con currentColor; aquí no hay colores.
    Un ícono siempre va con texto visible o, si está solo, con aria-label en el botón.
  -->

